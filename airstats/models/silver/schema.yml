version: 2

models:
  - name: silver_airports
    description: "{{ doc('silver_airports') }}"
    columns:
      - name: airport_ident
        description: Airport identifier used to join runways and comments.
        data_tests:
          - not_null
          - unique
      - name: airport_type
        description: Classification of the airport, including closed facilities.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [small_airport, medium_airport, large_airport, heliport, seaplane_base, balloonport, closed]
      - name: airport_name
        description: Airport name.
        data_tests:
          - not_null
      - name: airport_lat
        description: Latitude in decimal degrees.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
      - name: airport_long
        description: Longitude in decimal degrees.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180
      - name: continent
        description: Continent code.
      - name: iso_country
        description: ISO country code.
      - name: iso_region
        description: ISO region code.

  - name: silver_runways
    description: Runways with missing surfaces replaced by __UNKNOWN__.
    columns:
      - name: runway_id
        description: Unique runway identifier.
        data_tests:
          - not_null
          - unique
      - name: airport_ident
        description: Identifier of the associated airport.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_airports')
                field: airport_ident
              config:
                severity: warn
      - name: runway_length_ft
        description: Runway length in feet, when known.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: runway_width_ft
        description: Runway width in feet, when known.
      - name: runway_surface
        description: Surface material, or __UNKNOWN__ when missing.
        data_tests:
          - not_null
      - name: runway_lighted
        description: Indicator that the runway is lighted.
      - name: runway_closed
        description: Indicator that the runway is closed.

  - name: silver_airport_comments
    description: Incrementally loaded airport comments with nonempty bodies.
    columns:
      - name: comment_id
        description: Unique comment identifier and incremental watermark.
        data_tests:
          - not_null
          - unique
      - name: airport_ident
        description: Identifier of the associated airport.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_airports')
                field: airport_ident
              config:
                severity: warn
      - name: comment_timestamp
        description: Timestamp when the comment was posted.
        data_tests:
          - not_null
      - name: member_nickname
        description: Comment author, or __UNKNOWN__ when missing.
        data_tests:
          - not_null
      - name: comment_subject
        description: Comment subject.
      - name: comment_body
        description: Nonempty comment text.
        data_tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the comment was loaded into the silver model.
        data_tests:
          - not_null
